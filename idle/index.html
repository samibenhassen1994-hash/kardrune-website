<style>
  /* Only the host is sized. Flutter renders into this element with its own
     logical 430px viewport, including the bottom navigation and gestures. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070e20; color-scheme: dark; }
  body { display: flex; justify-content: center; align-items: center; position: relative; isolation: isolate; }
  #idle-game-frame { flex: 0 1 100%; width: 100%; height: 100vh; height: 100dvh; min-width: 0; position: relative; z-index: 1; background: #070e20; overflow: hidden; }
  #idle-side-art { display: none; }
  @media (min-width: 900px) {
    #idle-game-frame { height: min(100dvh, 780px); flex: 0 0 430px; width: 430px; max-width: 430px; box-shadow: 0 0 60px rgba(0,0,0,.7); border-inline: 1px solid rgba(219,181,104,.19); }
    #idle-side-art { display: block; position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    #idle-side-art::before, #idle-side-art::after {
      content: ""; position: absolute; top: -24px; bottom: -24px;
      width: calc((100% - 430px) / 2 + 24px);
      background-size: cover; background-repeat: no-repeat;
      filter: blur(14px) brightness(.38) saturate(.75); opacity: .87;
    }
    #idle-side-art::before { left: -24px; background-position: 50% 40%; background-image: linear-gradient(100deg,rgba(6,14,31,.35),rgba(6,14,31,.65)),url("assets/assets/idle/cards/young_sam/Sam_Last_Guardian_stage_3.webp"); }
    #idle-side-art::after { right: -24px; background-position: 50% 40%; background-image: linear-gradient(260deg,rgba(6,14,31,.35),rgba(6,14,31,.65)),url("assets/assets/idle/cards/aria/Aria_Fallen_Arcanist_stage_3.webp"); }
  }
</style>
