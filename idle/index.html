<style>
  /* Only the host is sized. Flutter renders into this element with its own
     logical 430px viewport, including the bottom navigation and gestures. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070e20; color-scheme: dark; }
  body { display: flex; justify-content: center; align-items: center; position: relative; isolation: isolate; }
  #idle-game-frame { flex: 0 1 100%; width: 100%; height: 100vh; height: 100dvh; min-width: 0; position: relative; z-index: 1; background: #070e20; overflow: hidden; }
  #idle-side-art { display: none; }
  @media (min-width: 900px) {
    #idle-game-frame { height: min(100dvh, 780px); flex: 0 0 430px; width: 430px; max-width: 430px; box-shadow: 0 0 60px rgba(0,0,0,.7); border-inline: 1px solid rgba(219,181,104,.19); }
    #idle-side-art { display: block; position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    #idle-side-art::before, #idle-side-art::after {
      content: ""; position: absolute; top: -24px; bottom: -24px;
      width: calc((100% - 430px) / 2 + 24px);
      background-size: cover; background-repeat: no-repeat;
      filter: blur(14px) brightness(.38) saturate(.75); opacity: .87;
    }
    #idle-side-art::before { left: -24px; background-position: 50% 40%; background-image: linear-gradient(100deg,rgba(6,14,31,.35),rgba(6,14,31,.65)),url("assets/assets/idle/cards/young_sam/Sam_Last_Guardian_stage_3.webp"); }
    #idle-side-art::after { right: -24px; background-position: 50% 40%; background-image: linear-gradient(260deg,rgba(6,14,31,.35),rgba(6,14,31,.65)),url("assets/assets/idle/cards/aria/Aria_Fallen_Arcanist_stage_3.webp"); }
  }
</style>

<body>
  <div id="idle-side-art" aria-hidden="true"></div>
  <div id="idle-game-frame" aria-label="Idle KardRune"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
  window.kardrunePushSubscribe = async uid => {
    try {
      if(!uid || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) throw Error('Push unsupported');
      const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
      if(permission!=='granted') throw Error('Permission not granted');
      const r=await fetch(new URL('../api/notifications/vapid',document.baseURI),{cache:'no-store'});
      if(!r.ok) throw Error('Push configuration unavailable');
      const settings=await r.json();
      if(!settings.enabled) throw Error('Web Push keys not configured');
      const reg=await navigator.serviceWorker.register('kardrune_service_worker.js',{scope:'./'});
      const data=atob(settings.publicKey.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(settings.publicKey.length/4)*4,'='));
      const key=Uint8Array.from(data,c=>c.charCodeAt(0));
      let sub=await reg.pushManager.getSubscription();
      if(sub){const prev=sub.options?.applicationServerKey;const equal=prev&&prev.byteLength===key.length&&Array.from(new Uint8Array(prev)).every((v,i)=>v===key[i]);if(!equal){await sub.unsubscribe();sub=null;}}
      if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
      return JSON.stringify({subscription:sub.toJSON()});
    }catch(e){return JSON.stringify({error:String(e)});}
  };
  window.kardrunePushCommit=uid=>localStorage.setItem('idle-push-current-uid',uid);
  window.kardrunePushStatus=async uid=>{
    try{
      if(!uid||!('serviceWorker' in navigator)||!('PushManager' in window)||Notification.permission!=='granted')return JSON.stringify({active:false});
      const r=await navigator.serviceWorker.ready;
      const s=await r.pushManager.getSubscription();
      return JSON.stringify({active:!!s&&localStorage.getItem('idle-push-current-uid')===uid});
    }catch(e){return JSON.stringify({active:false,error:String(e)});}
  };
  window.kardrunePushUnsubscribe=async()=>{
    try{const r=await navigator.serviceWorker.ready;const s=await r.pushManager.getSubscription();const endpoint=s?.endpoint||null;if(s)await s.unsubscribe();localStorage.removeItem('idle-push-current-uid');return JSON.stringify({endpoint});}
    catch(e){return JSON.stringify({error:String(e)});}
  };
  window.kardrunePushAccountChanged=async uid=>{
    const old=localStorage.getItem('idle-push-current-uid');
    if(old && old!==uid) await window.kardrunePushUnsubscribe();
  };
</script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // A version endpoint lets iOS home-screen PWAs detect deploys even without
    // a service-worker updatefound event. Keep all game data in local storage.
    (() => {
      const releaseUrl = new URL('release-id.json', document.baseURI);
      // CI replaces this marker before Flutter builds its service-worker manifest.
      const bundledRelease = '8aa83fa';
      let checking = false, needsUpdate = false, pendingRelease = null;
      let registration = null, requested = false;
      function announce() {
        needsUpdate = true;
        window.dispatchEvent(new Event('kardrune-update-available'));
      }
      async function checkRelease() {
        if (checking || requested) return;
        checking = true;
        try {
          const url = new URL(releaseUrl);
          url.searchParams.set('check', String(Date.now()));
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) return;
          const data = await response.json();
          const release = typeof data.release === 'string' ? data.release : '';
          if (!release) return;
          const key = 'idle-kardrune-active-release';
          const previous = localStorage.getItem(key);
          const stamped = /^[0-9a-f]{7,40}$/i.test(bundledRelease);
          if (stamped) {
            // Compare the running app bundle, not merely the last stored version.
            if (bundledRelease !== release) {
              pendingRelease = release;
              announce();
            } else if (previous !== release) localStorage.setItem(key, release);
          } else if (!previous) localStorage.setItem(key, release);
          else if (previous !== release) {
            pendingRelease = release;
            announce();
          }
        } catch (_) { /* Offline: keep the running game intact. */ }
        finally { checking = false; }
      }
      function refresh() {
        if (needsUpdate) announce();
        void checkRelease();
        if (registration) void registration.update().catch(() => {});
      }
      // Flutter may attach its listener after the first version check on iPhone.
      window.addEventListener('kardrune-request-update-status', refresh);
      window.addEventListener('focus', refresh);
      window.addEventListener('pageshow', refresh);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();
      });
      window.setInterval(refresh, 60000);
      window.addEventListener('kardrune-apply-update', () => {
        requested = true;
        if (pendingRelease) {
          try { localStorage.setItem('idle-kardrune-active-release', pendingRelease); }
          catch (_) {}
        }
        if (registration?.waiting) registration.waiting.postMessage('SKIP_WAITING');
        window.setTimeout(() => window.location.reload(), 450);
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('kardrune_service_worker.js',
            { scope: './', updateViaCache: 'none' }).then((value) => {
            registration = value;
            if (value.waiting) announce();
            value.addEventListener('updatefound', () => {
              const worker = value.installing;
              worker?.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) announce();
              });
            });
          }).catch(() => {});
        });
      }
      window.addEventListener('load', () => window.setTimeout(refresh, 3000));
    })();
  </script>
</body>
