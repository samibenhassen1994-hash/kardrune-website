<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Idle KardRune — collect, train and battle with KardRune heroes.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070e20">
<meta name="color-scheme" content="dark">
<style>
  /* Only the host is sized. Flutter renders into this element with its own
     logical 430px viewport, including the bottom navigation and gestures. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070e20; color-scheme: dark; }
  body { display: flex; justify-content: center; align-items: stretch; position: relative; isolation: isolate; }
  #idle-game-frame { flex: 0 1 100%; width: 100%; height: 100vh; height: 100dvh; min-width: 0; position: relative; z-index: 1; background: #070e20; overflow: hidden; }
  #idle-side-art { display: none; }
  @media (min-width: 900px) {
    #idle-game-frame { flex: 0 0 430px; width: 430px; max-width: 430px; box-shadow: 0 0 60px rgba(0,0,0,.7); border-inline: 1px solid rgba(219,181,104,.19); }
    #idle-side-art { display: block; position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    #idle-side-art::before, #idle-side-art::after {
      content: ""; position: absolute; top: -24px; bottom: -24px;
      width: calc((100% - 430px) / 2 + 24px);
      background-size: cover; background-repeat: no-repeat;
      filter: blur(14px) brightness(.38) saturate(.75); opacity: .87;
    }
    #idle-side-art::before { left: -24px; background-position: 50% 40%; background-image: linear-gradient(100deg,rgba(6,14,31,.35),rgba(6,14,31,.65)),url("assets/assets/idle/cards/young_sam/Sam_Last_Guardian_stage_3.webp"); }
    #idle-side-art::after { right: -24px; background-position: 50% 40%; background-image: linear-gradient(260deg,rgba(6,14,31,.35),rgba(6,14,31,.65)),url("assets/assets/idle/cards/aria/Aria_Fallen_Arcanist_stage_3.webp"); }
  }
</style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KardRune">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Idle KardRune</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="idle-side-art" aria-hidden="true"></div>
  <div id="idle-game-frame" aria-label="Idle KardRune"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('kardrune_service_worker.js', { scope: './', updateViaCache: 'none' }).then((registration) => {
          const announce = () => window.dispatchEvent(new Event('kardrune-update-available'));
          if (registration.waiting) announce();
          registration.addEventListener('updatefound', () => {
            const worker = registration.installing;
            worker?.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) announce();
            });
          });
          let userRequestedUpdate = false;
          window.addEventListener('kardrune-apply-update', () => {
            userRequestedUpdate = true;
            registration.waiting?.postMessage('SKIP_WAITING');
          });
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (userRequestedUpdate) window.location.reload();
          });
        });
      });
    }
  </script>
</body>
</html>
