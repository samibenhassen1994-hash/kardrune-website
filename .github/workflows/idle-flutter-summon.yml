name: Build Idle Flutter Summon
on:
  push:
    branches:
      - main
      - fix/idle-arena-double-button-size
      - fix/idle-arena-stable-cta-size-on-load
      - feature/idle-arena-start-cancel-assets
      - fix/idle-arena-title-up-15mm
      - fix/idle-arena-start-label-anchor
      - fix/idle-summon-banner-responsive-height
      - fix/idle-android-toolbar-and-summon-overlay
      - feature/idle-pvp-ranking-tabs-icons
      - feature/idle-arena-mobile-handoff
      - feature/idle-summon-animated-comparison
      - fix/idle-summon-stats-ios-update
      - fix/idle-pvp-ios-combined-main
      - feature/idle-pvp-best-of-three-arena
      - feature/idle-pvp-reward-readable-combat
      - fix/idle-pvp-iphone-animation-lag
      - feature/idle-pvp-projectiles-bestof3-complete
      - feature/idle-pvp-slash-sprite
      - fix/remove-idle-pvp-slash-animation
    paths:
      - 'idle_flutter/**'
      - '.github/workflows/idle-flutter-summon.yml'
  workflow_dispatch:
concurrency:
  group: idle-flutter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install, analyze and run deterministic tests
        working-directory: idle_flutter
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          node --test ../scripts/pwa-asset-update.test.mjs ../scripts/idle-pvp-leagues.test.mjs ../scripts/idle-pvp-ranking-pagination.test.mjs
          # Golden screenshot comparisons vary on GitHub's Linux renderer.
          # Keep them available via: flutter test test/golden_test.dart
          # Run every other unit/widget test before packaging the web release.
          mapfile -t test_files < <(find test -type f -name '*_test.dart' ! -name 'golden_test.dart' | sort)
          if (( ${#test_files[@]} == 0 )); then
            echo 'No unit or widget tests found.' >&2
            exit 1
          fi
          flutter test "${test_files[@]}"
      - name: Embed running release identity before build
        shell: bash
        run: |
          RELEASE="$(git rev-parse --short HEAD)"
          sed -i "s/__KARDRUNE_PACKAGED_RELEASE__/$RELEASE/g" idle_flutter/web/index.html
          sed -i "s/__KARDRUNE_PACKAGED_RELEASE__/$RELEASE/g" idle_flutter/web/kardrune_service_worker.js
          sed -i "s/__KARDRUNE_PACKAGED_RELEASE__/$RELEASE/g" idle_flutter/web/flutter_bootstrap.js
      - name: Build /idle/ release
        working-directory: idle_flutter
        run: flutter build web --release --base-href /idle/
      - name: Stamp release for PWA version checks
        shell: bash
        run: |
          node scripts/stamp-idle-release.mjs "$(git rev-parse --short HEAD)" idle_flutter/build/web
      - name: Verify and commit compiled frontend
        shell: bash
        run: |
          test -f idle_flutter/build/web/main.dart.js
          grep -q '<base href="/idle/">' idle_flutter/build/web/index.html
          rm -rf idle
          cp -a idle_flutter/build/web idle
          git add -A -- idle
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: compile updated Idle Flutter Summon frontend'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
