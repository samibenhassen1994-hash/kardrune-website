name: Build Idle Flutter Summon
on:
  push:
    branches:
      - main
      - feature/idle-summon-animated-comparison
      - fix/idle-summon-stats-ios-update
      - fix/idle-pvp-ios-combined-main
      - feature/idle-pvp-best-of-three-arena
      - feature/idle-pvp-reward-readable-combat
      - fix/idle-pvp-iphone-animation-lag
      - feature/idle-pvp-projectiles-bestof3-complete
      - feature/idle-pvp-slash-sprite
      - fix/remove-idle-pvp-slash-animation
    paths:
      - 'idle_flutter/**'
      - '.github/workflows/idle-flutter-summon.yml'
  workflow_dispatch:
concurrency:
  group: idle-flutter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install and analyze
        working-directory: idle_flutter
        run: |
          flutter pub get
          flutter analyze
      - name: Embed running release identity before build
        shell: bash
        run: |
          RELEASE="$(git rev-parse --short HEAD)"
          sed -i "s/__KARDRUNE_PACKAGED_RELEASE__/$RELEASE/g" idle_flutter/web/index.html
      - name: Build /idle/ release
        working-directory: idle_flutter
        run: flutter build web --release --base-href /idle/
      - name: Stamp release for PWA version checks
        shell: bash
        run: |
          printf '{"release":"%s"}\n' "$(git rev-parse --short HEAD)" > idle_flutter/build/web/release-id.json
      - name: Verify and commit compiled frontend
        shell: bash
        run: |
          test -f idle_flutter/build/web/main.dart.js
          grep -q '<base href="/idle/">' idle_flutter/build/web/index.html
          rm -rf idle
          cp -a idle_flutter/build/web idle
          git add -A -- idle
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: compile updated Idle Flutter Summon frontend'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
